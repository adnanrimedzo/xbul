name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        shell: bash # fails on a failed `pnpm test`, not on tee
        run: pnpm test 2>&1 | tee unit-tests.log
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            unit-tests.log
            test-results/
